<title>Food Menu</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bodoni+Moda:ital,opsz,wght@0,6..96,400..700;1,6..96,400..700&family=Jost:wght@300;400;500&display=swap">
<style>
/* Layout: two full-screen panels side by side; the menu card is page 1, the shopping list is page 2, reached by swiping. */
:root{
  --paper:#EDF0EA; --card:#F7F8F4; --ink:#1B231E; --muted:#5D6A61; --rule:#C6CFC6;
  --accent:#2E5B45; --brass:#9A7428; --have:#E1E7DF;
  --display:"Bodoni Moda","Didot","Bodoni 72",Georgia,serif;
  --body:"Jost","Avenir Next","Futura",system-ui,sans-serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --paper:#121815; --card:#1A221E; --ink:#E5EAE2; --muted:#93A096; --rule:#2D3832;
  --accent:#8DBFA2; --brass:#CFA95B; --have:#202A25; color-scheme:dark}}
:root[data-theme="dark"]{
  --paper:#121815; --card:#1A221E; --ink:#E5EAE2; --muted:#93A096; --rule:#2D3832;
  --accent:#8DBFA2; --brass:#CFA95B; --have:#202A25; color-scheme:dark}

html,body{height:100%;overflow:hidden}
body{background:var(--paper);color:var(--ink);font-family:var(--body);font-size:16px;line-height:1.45;-webkit-tap-highlight-color:transparent}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer;padding:0}
button:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:4px}

.viewport{height:100%;overflow:hidden}
.track{display:flex;width:200%;height:100%;will-change:transform}
.panel{width:50%;height:100%;overflow-y:auto;overflow-x:hidden;touch-action:pan-y;-webkit-overflow-scrolling:touch}
.inner{max-width:560px;margin:0 auto;padding-inline:20px;padding-block:28px 40px}

/* ---------- Menu card ---------- */
.mast{text-align:center;padding-block:18px 8px}
.mast .est{font-size:11px;letter-spacing:.28em;text-transform:uppercase;color:var(--muted)}
.mast h1{font-family:var(--display);font-weight:500;font-size:clamp(40px,12vw,58px);line-height:1;margin:10px 0 6px;letter-spacing:-.01em}
.mast h1 i{font-weight:400}
.mast .tag{font-family:var(--display);font-style:italic;color:var(--muted);font-size:16px}
.orn{display:flex;align-items:center;gap:12px;color:var(--brass);margin:22px auto 6px;max-width:220px}
.orn::before,.orn::after{content:"";flex:1;height:1px;background:var(--brass);opacity:.6}

.section{margin-top:30px}
.section h2{font-family:var(--display);font-weight:400;font-style:italic;font-size:28px;text-align:center;margin:0 0 4px}
.section .hours{text-align:center;font-size:11px;letter-spacing:.22em;text-transform:uppercase;color:var(--muted);margin-bottom:14px}
.dish{display:block;width:100%;text-align:left;padding-block:13px;border-top:1px solid var(--rule)}
.dish:last-child{border-bottom:1px solid var(--rule)}
.dish .row{display:flex;align-items:baseline;gap:8px}
.dish .nm{font-family:var(--display);font-size:20px;font-weight:500;letter-spacing:.005em}
.dish .lead{flex:1;border-bottom:1px dotted var(--muted);opacity:.5;transform:translateY(-4px);min-width:16px}
.dish .pr{font-family:var(--display);font-size:18px;font-variant-numeric:tabular-nums lining-nums}
.dish .ds{color:var(--muted);font-weight:300;font-size:14.5px;margin-top:2px;padding-right:56px}
.foot{text-align:center;margin-top:34px;color:var(--muted);font-size:12px;letter-spacing:.06em}
.dish .pr small{font-size:.62em;letter-spacing:.08em;color:var(--muted)}
.foot .snacks{font:inherit;letter-spacing:inherit;color:inherit;padding:4px 8px}
.snack-list .row{display:flex;align-items:baseline;gap:8px;padding-block:12px;border-bottom:1px solid var(--rule)}
.snack-list .nm{font-family:var(--display);font-size:20px;font-weight:500}
.snack-list .lead{flex:1;border-bottom:1px dotted var(--muted);opacity:.5;transform:translateY(-4px);min-width:16px}
.snack-list .pr{font-family:var(--display);font-size:18px;font-variant-numeric:tabular-nums lining-nums}
.snack-list .pr small{font-size:.62em;letter-spacing:.08em;color:var(--muted)}
.foot .seal{display:inline-block;margin-top:14px;color:var(--brass);font-family:var(--display);font-size:18px;opacity:.75;padding:6px 10px}

/* ---------- Dish sheet ---------- */
.scrim{position:fixed;inset:0;background:rgba(20,16,0,.45);opacity:0;pointer-events:none;transition:opacity .25s;z-index:10}
.scrim.on{opacity:1;pointer-events:auto}
.sheet{position:fixed;left:0;right:0;bottom:0;max-height:88%;overflow-y:auto;background:var(--card);border-radius:18px 18px 0 0;z-index:11;
  transform:translateY(105%);transition:transform .32s cubic-bezier(.2,.8,.2,1);padding:10px 22px calc(28px + env(safe-area-inset-bottom,0px))}
.sheet.on{transform:none}
.sheet .grip{width:40px;height:4px;border-radius:2px;background:var(--rule);margin:0 auto 14px}
.sheet .x{position:absolute;top:12px;right:14px;font-size:22px;color:var(--muted);width:36px;height:36px}
.sheet h3{font-family:var(--display);font-weight:500;font-size:30px;line-height:1.1;margin:4px 40px 6px 0;text-wrap:balance}
.sheet .sd{color:var(--muted);font-weight:300;margin:0 0 16px}
.sheet h4{font-size:11px;letter-spacing:.24em;text-transform:uppercase;color:var(--brass);font-weight:500;margin:22px 0 8px}
.ing{width:100%;border-collapse:collapse;font-variant-numeric:tabular-nums}
.ing td{padding:7px 0;border-bottom:1px solid var(--rule);vertical-align:top}
.ing td.q{color:var(--muted);width:38%;padding-right:10px}
.ing td.c{text-align:right;color:var(--muted);white-space:nowrap;padding-left:8px}
.ing tr.tot td{border-bottom:0;font-weight:500;color:var(--ink);padding-top:10px}
.steps{margin:0;padding-left:22px}
.steps li{margin-bottom:8px;padding-left:4px}
.steps li::marker{font-family:var(--display);color:var(--brass)}
.note{font-size:13px;color:var(--muted);margin-top:14px;font-style:italic}

/* ---------- Shopping panel ---------- */
.shop .inner{padding-bottom:120px}
.shop-head{display:flex;align-items:baseline;justify-content:space-between;gap:12px}
.shop-head h2{font-family:var(--display);font-weight:500;font-size:34px;margin:0}
.back{font-size:13px;color:var(--muted);letter-spacing:.04em;padding:6px 0}
.tabs{display:flex;gap:4px;background:var(--have);border-radius:999px;padding:4px;margin:16px 0 6px}
.tabs button{flex:1;padding:8px 0;border-radius:999px;font-size:14px;color:var(--muted)}
.tabs button[aria-pressed="true"]{background:var(--card);color:var(--ink);font-weight:500;box-shadow:0 1px 2px rgba(0,0,0,.08)}
.lbl{font-size:11px;letter-spacing:.24em;text-transform:uppercase;color:var(--brass);font-weight:500;margin:24px 0 6px}
.hint{font-size:13.5px;color:var(--muted);margin:0 0 8px}
.pick{display:flex;align-items:center;gap:10px;padding:9px 0;border-bottom:1px solid var(--rule)}
.pick .n{flex:1;min-width:0;font-family:var(--display);font-size:17px}
.pick .n small{display:block;font-family:var(--body);font-size:12px;color:var(--muted)}
.step{display:flex;align-items:center;border:1px solid var(--rule);border-radius:999px;overflow:hidden;flex-shrink:0}
.step button{width:34px;height:32px;font-size:18px;color:var(--accent)}
.step span{min-width:22px;text-align:center;font-variant-numeric:tabular-nums;font-weight:500}
.pick.on .step{border-color:var(--accent)}
.empty{padding:18px;text-align:center;color:var(--muted);border:1px dashed var(--rule);border-radius:12px;font-size:14px}
.aisle{font-size:12px;color:var(--muted);margin:16px 0 2px;letter-spacing:.06em}
.item{display:flex;align-items:center;gap:12px;padding:10px 0;border-bottom:1px solid var(--rule)}
.chk{width:26px;height:26px;border-radius:50%;border:1.5px solid var(--muted);flex-shrink:0;display:grid;place-items:center;font-size:14px;color:var(--paper)}
.item .t{flex:1;min-width:0;text-align:left}
.item .t b{font-weight:500;display:block}
.item .t small{display:block;color:var(--muted);font-size:12.5px;line-height:1.35}
.item .cost{font-variant-numeric:tabular-nums;white-space:nowrap;font-size:14px;text-align:right}
.item.home .chk{background:var(--accent);border-color:var(--accent)}
.item.home .t b{color:var(--muted);text-decoration:line-through}
.item.home .cost{color:var(--muted)}
.item.got .chk{background:var(--accent);border-color:var(--accent)}
.item.got .t b{text-decoration:line-through;color:var(--muted)}
.tag-home{font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--accent)}
.bar{position:sticky;bottom:0;margin-top:24px;background:var(--card);border:1px solid var(--rule);border-radius:14px;padding:12px 14px;
  display:flex;align-items:center;gap:12px;box-shadow:0 6px 20px rgba(0,0,0,.08)}
.bar .sum{flex:1;font-size:13px;color:var(--muted)}
.bar .sum b{display:block;font-size:20px;color:var(--ink);font-family:var(--display);font-weight:500;font-variant-numeric:tabular-nums lining-nums}
.go{background:var(--accent);color:var(--paper);padding:10px 16px;border-radius:999px;font-weight:500;font-size:14px}
.go[disabled]{opacity:.4}
.clear{display:block;margin:26px auto 0;font-size:13px;color:var(--muted);text-decoration:underline;text-underline-offset:3px;padding:8px}
.clear.arm{color:#B0412E}

@media (prefers-reduced-motion: reduce){.track,.sheet,.scrim{transition:none!important}}
</style>

<div class="viewport">
  <div class="track" id="track">
    <!-- Page 1: the menu -->
    <section class="panel" id="menuPanel" aria-label="Menu">
      <div class="inner">
        <header class="mast">
          <div class="est">Aarhus · Est. 2026</div>
          <h1>Menu</h1>
          <div class="tag">Cooked to order, for one</div>
          <div class="orn">✦</div>
        </header>
        <div id="menu"></div>
        <footer class="foot">
          <button class="snacks" id="snacksBtn">Snacks</button><br>
          <button class="seal" id="seal" aria-label="Open shopping list">❦</button>
        </footer>
      </div>
    </section>
    <!-- Page 2: the shopping list -->
    <section class="panel shop" id="shopPanel" aria-label="Shopping list">
      <div class="inner">
        <div class="shop-head">
          <h2>Shopping</h2>
          <button class="back" id="back">← Menu</button>
        </div>
        <div class="tabs" role="group" aria-label="Mode">
          <button id="tPlan" aria-pressed="true">1 · Plan</button>
          <button id="tStore" aria-pressed="false">2 · In the store</button>
        </div>
        <div id="shop"></div>
      </div>
    </section>
  </div>
</div>

<div class="scrim" id="scrim"></div>
<div class="sheet" id="sheet" role="dialog" aria-modal="true" aria-labelledby="sheetTitle">
  <div class="grip"></div>
  <button class="x" id="close" aria-label="Close">×</button>
  <div id="sheetBody"></div>
</div>

<script>

const AISLES=["Fruit & veg","Meat","Dairy & eggs","Bakery","Pantry","Spices"];
const kr=n=>n.toFixed(2);
const esc=s=>String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));

/* ---- state (kept on this device only) ---- */
const KEY="bistro-strop-v1";
let st={page:0,mode:"plan",portions:{},home:{},adj:{},got:{}};
try{const s=JSON.parse(localStorage.getItem(KEY));if(s)st=Object.assign(st,s)}catch(e){}
const save=()=>{try{localStorage.setItem(KEY,JSON.stringify(st))}catch(e){}};

/* ---- menu ---- */
document.getElementById("menu").innerHTML=MENU.map(s=>`
  <div class="section"><h2>${s.sec}</h2><div class="hours">${s.hours}</div>
  ${s.dishes.map(d=>`<button class="dish" data-id="${d.id}">
    <div class="row"><span class="nm">${esc(d.name)}</span><span class="lead"></span><span class="pr">${kr(d.price)} <small>DKK</small></span></div>
    <div class="ds">${esc(d.desc)}</div></button>`).join("")}</div>`).join("");

const sheet=document.getElementById("sheet"),scrim=document.getElementById("scrim");
let sheetOpen=false;
function openDish(id){
  const d=byId[id];
  const rows=d.ing.map(g=>{const nm=g.n||g.i.split("|").map(k=>ITEMS[k][0]).join(" & ");
    return `<tr><td class="q">${esc(g.a)}</td><td>${esc(nm)}</td><td class="c">${kr(g.c)} DKK</td></tr>`}).join("");
  document.getElementById("sheetBody").innerHTML=`
    <h3 id="sheetTitle">${esc(d.name)}</h3><p class="sd">${esc(d.desc)}</p>
    <h4>For one portion</h4>${d.batch?`<p class="note" style="margin:0 0 8px">${esc(d.batch)}</p>`:""}
    <table class="ing">${rows}<tr class="tot"><td class="q"></td><td>Cost per portion</td><td class="c">${kr(d.price)} DKK</td></tr></table>
    <h4>Method</h4><ol class="steps">${d.steps.map(s=>`<li>${esc(s)}</li>`).join("")}</ol>
    ${d.macros?`<p class="note">${esc(d.macros)}</p>`:""}`;
  sheet.scrollTop=0;sheet.classList.add("on");scrim.classList.add("on");sheetOpen=true;
  document.getElementById("close").focus({preventScroll:true});
}
function openSnacks(){
  document.getElementById("sheetBody").innerHTML=`<h3 id="sheetTitle">Snacks</h3><p class="sd">Between meals</p>
    <div class="snack-list">${SNACKS.map(([n,p])=>`<div class="row"><span class="nm">${esc(n)}</span><span class="lead"></span><span class="pr">${kr(p)} <small>DKK</small></span></div>`).join("")}</div>`;
  sheet.scrollTop=0;sheet.classList.add("on");scrim.classList.add("on");sheetOpen=true;
  document.getElementById("close").focus({preventScroll:true});
}
function closeDish(){sheet.classList.remove("on");scrim.classList.remove("on");sheetOpen=false}
document.getElementById("menu").addEventListener("click",e=>{const b=e.target.closest(".dish");if(b)openDish(b.dataset.id)});
document.getElementById("snacksBtn").onclick=openSnacks;
scrim.onclick=closeDish;document.getElementById("close").onclick=closeDish;

/* ---- shopping maths ---- */
function needs(){
  const m={};
  for(const d of DISHES){const p=st.portions[d.id]||0;if(!p)continue;
    for(const g of d.ing)for(const k of g.i.split("|")){
      const f=(g.f!=null?g.f:g.c/ITEMS[k][2])*p;
      (m[k]??={f:0,dishes:new Set()}).f+=f;m[k].dishes.add(d.name);
    }}
  for(const k in m){m[k].auto=Math.max(1,Math.ceil(m[k].f-1e-6));m[k].packs=st.adj[k]??m[k].auto}
  return m;
}
function usage(f,pack){return f<0.995?`uses ~${Math.max(1,Math.round(f*100))}% of a ${pack}`:`needs ${(Math.round(f*10)/10).toString()} × ${pack}`}

function renderShop(){
  document.getElementById("tPlan").setAttribute("aria-pressed",st.mode==="plan");
  document.getElementById("tStore").setAttribute("aria-pressed",st.mode==="store");
  const N=needs(),keys=Object.keys(N);
  const buy=keys.filter(k=>!st.home[k]);
  const total=buy.reduce((s,k)=>s+N[k].packs*ITEMS[k][2],0);
  const portions=Object.values(st.portions).reduce((a,b)=>a+b,0);
  const byAisle=list=>AISLES.map(a=>[a,list.filter(k=>ITEMS[k][3]===a).sort((x,y)=>ITEMS[x][0].localeCompare(ITEMS[y][0]))]).filter(([,l])=>l.length);
  let h="";
  if(st.mode==="plan"){
    h+=`<div class="lbl">What are you cooking?</div>`;
    h+=MENU.map(s=>s.dishes.map(d=>{const p=st.portions[d.id]||0;
      return `<div class="pick${p?" on":""}"><div class="n">${esc(d.name)}<small>${s.sec} · ${kr(d.price)} DKK</small></div>
      <div class="step"><button data-dish="${d.id}" data-d="-1" aria-label="One less ${esc(d.name)}">−</button><span>${p}</span><button data-dish="${d.id}" data-d="1" aria-label="One more ${esc(d.name)}">+</button></div></div>`}).join("")).join("");
    h+=`<div class="lbl">Ingredients</div>`;
    if(!keys.length)h+=`<div class="empty">Add a portion of something above and its ingredients show up here.</div>`;
    else{
      h+=`<p class="hint">Tap anything you already have at home. Use − / + to change how many packs to buy.</p>`;
      for(const [a,list] of byAisle(keys)){
        h+=`<div class="aisle">${a}</div>`;
        for(const k of list){const it=ITEMS[k],n=N[k],home=!!st.home[k];
          h+=`<div class="item${home?" home":""}">
            <button class="chk" data-home="${k}" aria-label="${home?"Need to buy":"Have at home"}: ${esc(it[0])}">${home?"✓":""}</button>
            <button class="t" data-home="${k}"><b>${esc(it[0])}</b><small>${home?`<span class="tag-home">At home</span> · `:""}${usage(n.f,it[1])} · ${[...n.dishes].join(", ")}</small></button>
            ${home?`<span class="cost">—</span>`:`<div class="step"><button data-pack="${k}" data-d="-1" aria-label="One pack less">−</button><span>${n.packs}</span><button data-pack="${k}" data-d="1" aria-label="One pack more">+</button></div>`}
          </div>`}
      }
    }
    h+=`<div class="bar"><div class="sum">${buy.length} to buy · ${portions} portion${portions===1?"":"s"}<b>${kr(total)} DKK</b></div>
       <button class="go" id="goStore" ${buy.length?"":"disabled"}>Go shopping →</button></div>`;
  }else{
    const left=buy.filter(k=>!st.got[k]),done=buy.filter(k=>st.got[k]);
    const leftCost=left.reduce((s,k)=>s+N[k].packs*ITEMS[k][2],0);
    if(!buy.length)h+=`<div class="empty" style="margin-top:20px">Nothing to buy yet. Plan a meal in step 1.</div>`;
    else{
      h+=`<p class="hint" style="margin-top:14px">Tap an item when it is in your basket.</p>`;
      for(const [a,list] of byAisle(left)){
        h+=`<div class="aisle">${a}</div>`;
        for(const k of list){const it=ITEMS[k],n=N[k];
          h+=`<button class="item" data-got="${k}" style="width:100%"><span class="chk"></span>
            <span class="t"><b>${n.packs} × ${esc(it[0])}</b><small>${esc(it[1])}</small></span><span class="cost">${kr(n.packs*it[2])} DKK</span></button>`}
      }
      if(done.length){h+=`<div class="aisle">In the basket</div>`;
        for(const k of done){const it=ITEMS[k],n=N[k];
          h+=`<button class="item got" data-got="${k}" style="width:100%"><span class="chk">✓</span>
            <span class="t"><b>${n.packs} × ${esc(it[0])}</b><small>${esc(it[1])}</small></span><span class="cost">${kr(n.packs*it[2])} DKK</span></button>`}}
      h+=`<div class="bar"><div class="sum">${left.length} of ${buy.length} left<b>${kr(leftCost)} DKK</b></div>
        <span class="sum" style="flex:0;text-align:right;white-space:nowrap">trip total<br>${kr(total)} DKK</span></div>`;
    }
  }
  h+=`<button class="clear" id="clear">Start a new list</button>`;
  document.getElementById("shop").innerHTML=h;
}

document.getElementById("shop").addEventListener("click",e=>{
  const t=e.target.closest("button");if(!t)return;
  if(t.dataset.dish){const id=t.dataset.dish;st.portions[id]=Math.max(0,(st.portions[id]||0)+ +t.dataset.d);if(!st.portions[id])delete st.portions[id];st.adj={}}
  else if(t.dataset.pack){const k=t.dataset.pack,N=needs();const v=N[k].packs+ +t.dataset.d;
    if(v<=0){st.home[k]=true;delete st.adj[k]}else st.adj[k]=v}
  else if(t.dataset.home){const k=t.dataset.home;st.home[k]?delete st.home[k]:st.home[k]=true}
  else if(t.dataset.got){const k=t.dataset.got;st.got[k]?delete st.got[k]:st.got[k]=true}
  else if(t.id==="goStore"){st.mode="store";document.getElementById("shopPanel").scrollTop=0}
  else if(t.id==="clear"){
    if(!t.classList.contains("arm")){t.classList.add("arm");t.textContent="Tap again to clear everything";setTimeout(()=>{if(t.isConnected){t.classList.remove("arm");t.textContent="Start a new list"}},3000);return}
    st.portions={};st.home={};st.adj={};st.got={};st.mode="plan";
  }else return;
  save();renderShop();
});
document.getElementById("tPlan").onclick=()=>{st.mode="plan";save();renderShop()};
document.getElementById("tStore").onclick=()=>{st.mode="store";save();renderShop()};

/* ---- paging: swipe on phone, arrow keys or the ❦ on laptop ---- */
const track=document.getElementById("track");
function go(p,animate=true){
  st.page=p;save();
  track.style.transition=animate?"transform .38s cubic-bezier(.2,.8,.2,1)":"none";
  track.style.transform=`translateX(${-p*50}%)`;
  document.getElementById("menuPanel").inert=p===1;document.getElementById("shopPanel").inert=p===0;
  if(p===1)renderShop();
}
document.getElementById("seal").onclick=()=>go(1);
document.getElementById("back").onclick=()=>go(0);
addEventListener("keydown",e=>{
  if(e.key==="Escape"&&sheetOpen)return closeDish();
  if(sheetOpen)return;
  if(e.key==="ArrowRight")go(1);if(e.key==="ArrowLeft")go(0);
});
let sx=0,sy=0,dx=0,lock=null,w=1;
track.addEventListener("touchstart",e=>{if(sheetOpen||e.touches.length>1)return;
  sx=e.touches[0].clientX;sy=e.touches[0].clientY;dx=0;lock=null;w=innerWidth;},{passive:true});
track.addEventListener("touchmove",e=>{if(sheetOpen||lock==="v")return;
  const x=e.touches[0].clientX-sx,y=e.touches[0].clientY-sy;
  if(lock===null){if(Math.abs(x)<8&&Math.abs(y)<8)return;lock=Math.abs(x)>Math.abs(y)*1.2?"h":"v";if(lock==="v")return}
  e.preventDefault();dx=x;
  const edge=(st.page===0&&dx>0)||(st.page===1&&dx<0);
  const off=edge?dx*0.2:dx;
  track.style.transition="none";
  track.style.transform=`translateX(calc(${-st.page*50}% + ${off}px))`;
},{passive:false});
track.addEventListener("touchend",()=>{if(lock!=="h")return;
  const t=Math.min(80,w*0.18);
  if(st.page===0&&dx<-t)go(1);else if(st.page===1&&dx>t)go(0);else go(st.page);lock=null;});

/* swipe down on the dish card closes it */
let ssy=0;
sheet.addEventListener("touchstart",e=>{ssy=e.touches[0].clientY},{passive:true});
sheet.addEventListener("touchend",e=>{if(sheet.scrollTop<=0&&e.changedTouches[0].clientY-ssy>90)closeDish()});

go(st.page,false);
</script>
